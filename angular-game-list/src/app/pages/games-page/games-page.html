<section>
  <h2>Каталог игр</h2>

  @if (loading) {
    <p>Загрузка игр...</p>
  } @else if (error) {
    <p class="error">
      {{ error }}
    </p>
  } @else {
    <div class="games">
      @for (game of games; track game.id) {
        <article class="game-card">
          <img [src]="game.image" [alt]="game.title" />

          <h3>{{ game.title }}</h3>

          <p>Жанр: {{ game.genre }}</p>

          <p>Платформа: {{ game.platform }}</p>

          <p>Издатель: {{ game.publisher }}</p>

          <a [routerLink]="['/games', game.id]"> Подробнее </a>
        </article>
      }
    </div>
  }
</section>
